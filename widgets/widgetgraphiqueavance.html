<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAPL — Graphique avancé</title>
  <style>
    html, body { margin:0; background:#0F0F0F; } /* ou transparent si tu veux */
    .chart {
      width: 100%;
      height: 620px;       /* hauteur EXPLICITE = clé de stabilité */
      border-radius: 32px; /* bords arrondis légers */
      overflow: hidden;
    }
    .tradingview-widget-container,
    .tradingview-widget-container__widget { width:100%; height:100%; }
    .tradingview-widget-copyright { display:none !important; }
  </style>
  <link rel="preconnect" href="https://s3.tradingview.com">
  <link rel="dns-prefetch" href="//s3.tradingview.com">
</head>
<body>
  <div class="chart">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "symbol": "NASDAQ:AAPL",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "fr",

        "hide_top_toolbar": true,
        "hide_side_toolbar": true,
        "hide_legend": true,
        "hide_volume": true,

        "details": false,
        "calendar": false,
        "withdateranges": false,
        "save_image": false,

        "backgroundColor": "#0F0F0F",
        "gridColor": "rgba(242,242,242,0.06)",

        "autosize": false,          /* <-- important */
        "width": "100%",
        "height": "100%"
      }
      </script>
    </div>
  </div>
</body>
</html>
