<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graphique Avancé — AAPL</title>
  <style>
    html, body {
      margin: 0;
      background: transparent;
    }
    .chart-container {
      width: 100%;
      height: 600px;             /* hauteur fixe plus stable */
      border-radius: 16px;       /* bords arrondis légers */
      overflow: hidden;          /* évite les débordements */
    }
    .tradingview-widget-copyright {
      display: none !important;  /* supprime le texte TradingView */
    }
  </style>
</head>
<body>

  <div class="chart-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "symbol": "NASDAQ:AAPL",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "fr",
        "hide_top_toolbar": true,
        "hide_side_toolbar": true,
        "hide_legend": true,
        "hide_volume": true,
        "details": false,
        "calendar": false,
        "withdateranges": false,
        "backgroundColor": false,
        "gridColor": "rgba(242,242,242,0.06)",
        "autosize": true
      }
      </script>
    </div>
  </div>

</body>
</html>
