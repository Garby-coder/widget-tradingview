<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widget Graphique Avancé</title>
  <style>
    html, body { margin:0; background:transparent; }
    .widget-wrap {
      width: 100%;
      height: 600px;            /* <- hauteur fixe, très fiable en embed */
      border-radius: 32px;
      overflow: hidden;
      background: transparent;
    }
    .tradingview-widget-container { width:100%; height:100%; }
    .tradingview-widget-container__widget { width:100%; height:100%; }
    .tradingview-widget-copyright { display:none !important; }
  </style>
</head>
<body>
  <div class="widget-wrap">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "symbol": "NASDAQ:AAPL",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "fr",

        "hide_top_toolbar": true,
        "hide_side_toolbar": true,
        "hide_legend": false,
        "hide_volume": true,

        "details": false,
        "calendar": false,
        "withdateranges": false,
        "save_image": false,

        "backgroundColor": "transparent",
        "gridColor": "rgba(242,242,242,0.06)",

        "allow_symbol_change": true,
        "autosize": false,              /* autosize OFF */
        "width": "100%",
        "height": "100%"
      }
      </script>
    </div>
  </div>
</body>
</html>
