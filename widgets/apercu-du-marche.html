<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Overview</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
    }
    .widget-wrap {
      width: 100%;
      height: 100vh;
      border-radius: 32px;       /* Coins arrondis */
      overflow: hidden;
      background: transparent;   /* Fond transparent */
    }
    .tradingview-widget-copyright {
      display: none !important;  /* Supprime le texte bleu */
    }
  </style>
</head>
<body>

  <div class="widget-wrap">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
      {
        "colorTheme": "dark",
        "dateRange": "12M",
        "locale": "fr",
        "largeChartUrl": "",
        "isTransparent": true,
        "showFloatingTooltip": true,
        "plotLineColorGrowing": "rgba(76, 175, 80, 1)",
        "plotLineColorFalling": "rgba(242, 54, 69, 1)",
        "gridLineColor": "rgba(240, 243, 250, 0)",
        "scaleFontColor": "#DBDBDB",
        "belowLineFillColorGrowing": "rgba(41, 98, 255, 0.12)",
        "belowLineFillColorFalling": "rgba(41, 98, 255, 0.12)",
        "belowLineFillColorGrowingBottom": "rgba(41, 98, 255, 0)",
        "belowLineFillColorFallingBottom": "rgba(41, 98, 255, 0)",
        "symbolActiveColor": "rgba(41, 98, 255, 0.12)",
        "backgroundColor": "#0f0f0f",
        "showSymbolLogo": true,
        "showChart": true,
        "support_host": "https://www.tradingview.com",
        "width": "100%",
        "height": "100%",
        "tabs": [
          {
            "title": "Indices",
            "symbols": [
              { "s": "FOREXCOM:SPXUSD", "d": "S&P 500 Index" },
              { "s": "FOREXCOM:NSXUSD", "d": "US 100 Cash CFD" },
              { "s": "FOREXCOM:DJI", "d": "Dow Jones Industrial Average Index" },
              { "s": "INDEX:NKY", "d": "Japan 225" },
              { "s": "INDEX:DEU40", "d": "DAX Index" },
              { "s": "FOREXCOM:UKXGBP", "d": "FTSE 100 Index" }
            ]
          },
          {
            "title": "Futures",
            "symbols": [
              { "s": "BMFBOVESPA:ISP1!", "d": "S&P 500" },
              { "s": "BMFBOVESPA:EUR1!", "d": "Euro" },
              { "s": "CMCMARKETS:GOLD", "d": "Gold" },
              { "s": "PYTH:WTI3!", "d": "WTI Crude Oil" },
              { "s": "BMFBOVESPA:CCM1!", "d": "Corn" }
            ]
          },
          {
            "title": "Bonds",
            "symbols": [
              { "s": "EUREX:FGBL1!", "d": "Euro Bund" },
              { "s": "EUREX:FBTP1!", "d": "Euro BTP" },
              { "s": "EUREX:FGBM1!", "d": "Euro BOBL" }
            ]
          },
          {
            "title": "Forex",
            "symbols": [
              { "s": "FX:EURUSD", "d": "EUR to USD" },
              { "s": "FX:GBPUSD", "d": "GBP to USD" },
              { "s": "FX:USDJPY", "d": "USD to JPY" },
              { "s": "FX:USDCHF", "d": "USD to CHF" },
              { "s": "FX:AUDUSD", "d": "AUD to USD" },
              { "s": "FX:USDCAD", "d": "USD to CAD" }
            ]
          }
        ]
      }
      </script>
    </div>
  </div>

</body>
</html>
